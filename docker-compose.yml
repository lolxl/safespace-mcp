# SafeSpace MCP — Model B deployment (one host, one container, one process).
#
# Scenario: a Linux home host with Tailscale already installed (docs/model-b-deployment.md
# §5.1). The container uses HOST networking so it binds the host's tailscale 100.x
# interface directly AND reaches the host's tailscaled LocalAPI socket for WhoIs.
# (No Tailscale on the host? Use the tailscale/tailscale sidecar — see docs/DEPLOY.md.)
#
# ⚠️ Model A (single-user, stdio) does NOT use this — it is a child process of your
#    own Claude, no container. This is the SHARED multi-operator server only.
#
# Fill in the host-specific values via a gitignored `.env` beside this file
# (SAFESPACE_HTTP_BIND, SAFESPACE_HTTP_PORT, GOOGLE_CLIENT_ID) and drop the secret
# files under ./secrets/ (mode 600). See docs/DEPLOY.md.

services:
  safespace:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    # Linux-only. Shares the host network namespace → the listener binds the host's
    # tailscale 100.x IP, and the tailscaled socket mount below is reachable. No
    # `ports:` mapping is used (host networking) — exposure is the bind address.
    network_mode: host

    # Non-root (the image's `bun` user, uid 1000) + no privilege escalation.
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    # Optional extra hardening (test on your host first — Bun's runtime cache may
    # need a writable path): `read_only: true` + `tmpfs: [/tmp]`. See docs/DEPLOY.md.

    environment:
      SAFESPACE_TRANSPORT: "http"
      # Bind the HOST's tailscale IP (100.x.y.z). NEVER 0.0.0.0 — the app refuses to
      # default there, and 0.0.0.0 would expose an authed-but-internet-facing listener.
      SAFESPACE_HTTP_BIND: "${SAFESPACE_HTTP_BIND:?set SAFESPACE_HTTP_BIND to the host tailscale 100.x IP}"
      SAFESPACE_HTTP_PORT: "${SAFESPACE_HTTP_PORT:-8765}"
      SAFESPACE_CONFIG_DIR: "/data"
      SAFESPACE_OPERATORS_FILE: "/data/operators.json"
      SAFESPACE_SECRET_BACKEND: "file"
      # OAuth-app client IDs are NOT secret (the matching SECRETs come from ./secrets
      # via entrypoint.sh). Set GOOGLE_CLIENT_ID (+ GITHUB_CLIENT_ID if you use GitHub).
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      # STRONGLY RECOMMENDED for an unattended shared server: deny-by-default
      # allowlists + permanent-delete deny (F2/F4). If you enable it, configure the
      # recipient/drive/tasks-delete allowlists or those tools deny by default.
      # SAFESPACE_AUTONOMOUS: "true"

    volumes:
      # Persistent file-shaped state: audit.jsonl (run_id forensics survive restart),
      # accounts + index, the encrypted token store, drive-whitelist.json.
      - safespace-data:/data
      # The host tailscaled LocalAPI socket (READ-ONLY) → verified WhoIs identity.
      # SAFESPACE_TAILSCALE_SOCKET defaults to this path, so no override is needed.
      - /run/tailscale/tailscaled.sock:/run/tailscale/tailscaled.sock:ro

    secrets:
      - safespace_passphrase
      - google_client_secret
      # - github_client_secret   # uncomment if you enable the GitHub source

volumes:
  safespace-data:

# Compose secrets: file-mounted at /run/secrets/<name> (tmpfs, mode 0400),
# bridged to env by entrypoint.sh. Keep ./secrets/ gitignored + chmod 600.
secrets:
  safespace_passphrase:
    file: ./secrets/safespace_passphrase
  google_client_secret:
    file: ./secrets/google_client_secret
  # github_client_secret:
  #   file: ./secrets/github_client_secret
