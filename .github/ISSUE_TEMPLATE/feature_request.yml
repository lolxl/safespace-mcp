name: Feature request
description: Suggest a new capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        SafeSpace makes deliberate security trade-offs. A proposal that adds a
        tool, an OAuth scope, or relaxes a control will be weighed against the
        threat model in `SECURITY.md`.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that SafeSpace can't do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: >-
        New tool, scope, or external-data path? How should it be gated (tier,
        allowlist, sanitize)?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
