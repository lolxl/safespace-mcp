# Bun test runner config.
#
# `preload` ensures `src/google-api/test-utils.ts` (which calls `mock.module`
# on `gaxios` at top level) is loaded BEFORE any test file. Without this,
# tests that run earlier (alphabetically) cause googleapis → gaxios to be
# cached, after which `mock.module("gaxios")` calls in later tests are a no-op.
#
# v1.11 Phase 1b — added when the googleapis SDK migration started.
[test]
# `./src/test-preload-audit.ts` resets the audit chain state and role before every test
# (a `runCli` test switches the process to the CLI chain; Bun shares module state across
# files).
preload = ["./src/google-api/test-utils.ts", "./src/test-preload-audit.ts"]
